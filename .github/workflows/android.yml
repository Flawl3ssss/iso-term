name: Build debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Setup Gradle 8.10.2 (no wrapper in repo)
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          unzip -q gradle-8.10.2-bin.zip -d $HOME
          echo "$HOME/gradle-8.10.2/bin" >> $GITHUB_PATH

      - name: Accept SDK licenses + ensure API 36
        run: |
          export SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" || true

      - name: Build debug APK
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          $HOME/gradle-8.10.2/bin/gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: isoterm-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
